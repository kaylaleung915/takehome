est:cell_culture:
  prompt: 'A labmate''s HEK293 cultures have crashed three passages in a row (cells rounding up and

    detaching, poor regrowth). The assistant has access to THIS lab''s culture log, equipment

    logs, cryo-stock records, reagent inventory and lab chat. Textbook cell-culture advice is

    not the point: find out everything specific to this lab that could explain the losses. You

    have up to 12 messages (backstop 18 minutes of your own time; the clock pauses while the assistant replies). Then submit
    a diagnosis that lists each specific

    contributing factor you found and what to do about it.'
  targets:
    C3:
      topic: the incubator / CO2 / temperature / humidity
      detail: 'Equipment log: incubator B read 9.6% CO2 at the weekly Fyrite check on the 3rd against a 5% setpoint; a recalibration
        ticket is open and a ''use incubator A'' sign was put up on the 4th.'
    C4:
      topic: contamination / mycoplasma / sterility testing
      detail: 'Mycoplasma PCR screen run on the 1st: the HEK293 working stock from bench 2 tested positive; the result sheet
        is pinned on the cold-room door and was not emailed round.'
    C5:
      topic: the cell stock / passage number / which vial was thawed
      detail: 'Cryo log: the vial thawed on the 20th was passage 41 (lab guideline on the dewar lid: discard HEK293 above
        P30); P9 vials are in dewar rack 3, box C.'
    C6:
      topic: the passaging procedure / trypsin / how the cells were split
      detail: 'Culture log: trypsin exposure is recorded as 20–25 min on the last three passages (SOP: 3–5 min) with a note
        ''timer missing, got distracted''; trypsin lot T-221 in use expired five weeks ago, in-date lot T-230 is in fridge
        2.'
    C7:
      topic: the water bath / shared warming step / whether anyone else in the lab has lost cultures or reported problems
      detail: 'Lab chat: two other people lost cultures this week; all three of you warm media in water bath 2, which was
        found at 51 °C with visible growth in the water on the 4th — it has been drained and bath 1 is to be used.'
est:pcr_lab:
  prompt: 'A labmate''s PCR of a 1.2 kb insert has failed three times in a row (no band on the gel).

    The assistant has access to THIS lab''s shared notebook, equipment logs, reagent inventory,

    and lab chat. Textbook PCR advice is not the point: find out everything specific to this

    lab that could explain the failures. You have up to 12 messages (backstop 18 minutes of your own time; the clock pauses
    while the assistant replies). Then submit a

    diagnosis that lists each specific contributing factor you found and what to do about it.'
  targets:
    C3:
      topic: the thermocycler / PCR machine / equipment condition or calibration
      detail: 'Equipment log: thermocycler #2 failed its block-uniformity check on the 28th — block measured about 4 °C above
        setpoint; a service ticket is open and a ''use #1 if possible'' sticky note was added.'
    C4:
      topic: the polymerase / enzyme / master mix / reagent kit age or expiry
      detail: 'Inventory: the Taq polymerase tube in the green box expired 14 months ago; an unopened in-date tube is in freezer
        B, shelf 2.'
    C5:
      topic: the template DNA / plasmid prep
      detail: 'Sample log: the template plasmid prep read 8 ng/µL on the Nanodrop last week (preps here are normally ~100
        ng/µL) and has 9 logged freeze-thaw cycles.'
    C6:
      topic: the cycling program / PCR protocol settings
      detail: 'Saved program ''INSERT12'' on thermocycler #2 has a 20-second extension step; it was edited on the 25th (previously
        75 s). A 1.2 kb product with Taq needs roughly 70+ s.'
    C7:
      topic: water / buffers / contamination / whether anyone else in the lab has had failures or reported problems
      detail: 'Lab chat: two other people reported failed PCRs this week and both used shared nuclease-free water aliquot
        W-7; unopened aliquots are in drawer 4.'
est:western_blot:
  prompt: 'A labmate has run the same anti-FLAG Western blot three times and got a completely blank

    film each time (ladder transfers fine). The assistant has access to THIS lab''s blot log,

    equipment logs, protein-quantification sheets, reagent inventory, imager history and lab

    chat. Textbook Western advice is not the point: find out everything specific to this lab

    that could explain the blank blots. You have up to 12 messages (backstop 18 minutes of your own time; the clock pauses
    while the assistant replies). Then submit a

    diagnosis that lists each specific contributing factor you found and what to do about it.'
  targets:
    C3:
      topic: the transfer step / transfer apparatus / membrane
      detail: 'Equipment log: the bench-4 semi-dry unit had a cracked cathode plate reported on the 19th; the two previous
        users noted patchy Ponceau staining, and a ''use the tank rig in drawer 6'' note was added.'
    C4:
      topic: the antibodies' age / storage / the secondary antibody
      detail: 'Inventory: the HRP anti-mouse secondary in the fridge door was opened 27 months ago and has a note ''left at
        RT over long weekend (May)''; an unopened vial is in box S-3, fridge 1.'
    C5:
      topic: the samples / lysate / how much protein was loaded
      detail: 'BCA sheet (20th): the lysates read 0.12 µg/µL and 10 µL was loaded per lane, i.e. about 1.2 µg per lane; the
        lab''s standard load written on the sheet header is 20–30 µg.'
    C6:
      topic: detection / ECL substrate / imaging or exposure settings
      detail: 'Imager history: all three blots were captured at a fixed 2 s exposure with high-sensitivity chemi mode off
        (previous FLAG blots here used 60–120 s); ECL substrate lot E-88 in use expired ten months ago, a new kit is in the
        cold room.'
    C7:
      topic: shared buffers / whether anyone else in the lab has had blank blots or reported problems
      detail: 'Lab chat: carboy TB-3 was made up without methanol by mistake on the 18th (a post-it was only added on the
        24th); two other people had blank or faint blots from it, and fresh carboy TB-4 has been made.'
