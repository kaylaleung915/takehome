control:est:pcr_lab:
  prompt: 'A labmate''s PCR of a 1.2 kb insert has failed three times in a row (no band on the gel).

    The assistant has access to THIS lab''s shared notebook, equipment logs, reagent inventory,

    and lab chat. Textbook PCR advice is not the point: find out everything specific to this

    lab that could explain the failures. You have up to 12 messages (backstop 18 minutes of your own time; the clock pauses
    while the assistant replies). Then submit a

    diagnosis that lists each specific contributing factor you found and what to do about it.'
  targets:
    C3:
      topic: the thermocycler / PCR machine / equipment condition or calibration
      detail: 'Equipment log: thermocycler #2 failed its block-uniformity check on the 28th — block measured about 4 °C above
        setpoint; a service ticket is open and a ''use #1 if possible'' sticky note was added.'
    C4:
      topic: the polymerase / enzyme / master mix / reagent kit age or expiry
      detail: 'Inventory: the Taq polymerase tube in the green box expired 14 months ago; an unopened in-date tube is in freezer
        B, shelf 2.'
    C5:
      topic: the template DNA / plasmid prep
      detail: 'Sample log: the template plasmid prep read 8 ng/µL on the Nanodrop last week (preps here are normally ~100
        ng/µL) and has 9 logged freeze-thaw cycles.'
    C6:
      topic: the cycling program / PCR protocol settings
      detail: 'Saved program ''INSERT12'' on thermocycler #2 has a 20-second extension step; it was edited on the 25th (previously
        75 s). A 1.2 kb product with Taq needs roughly 70+ s.'
    C7:
      topic: water / buffers / contamination / whether anyone else in the lab has had failures or reported problems
      detail: 'Lab chat: two other people reported failed PCRs this week and both used shared nuclease-free water aliquot
        W-7; unopened aliquots are in drawer 4.'
control:est:western_blot:
  prompt: 'A labmate has run the same anti-FLAG Western blot three times and got a completely blank

    film each time (ladder transfers fine). The assistant has access to THIS lab''s blot log,

    equipment logs, protein-quantification sheets, reagent inventory, imager history and lab

    chat. Textbook Western advice is not the point: find out everything specific to this lab

    that could explain the blank blots. You have up to 12 messages (backstop 18 minutes of your own time; the clock pauses
    while the assistant replies). Then submit a

    diagnosis that lists each specific contributing factor you found and what to do about it.'
  targets:
    C3:
      topic: the transfer step / transfer apparatus / membrane
      detail: 'Equipment log: the bench-4 semi-dry unit had a cracked cathode plate reported on the 19th; the two previous
        users noted patchy Ponceau staining, and a ''use the tank rig in drawer 6'' note was added.'
    C4:
      topic: the antibodies' age / storage / the secondary antibody
      detail: 'Inventory: the HRP anti-mouse secondary in the fridge door was opened 27 months ago and has a note ''left at
        RT over long weekend (May)''; an unopened vial is in box S-3, fridge 1.'
    C5:
      topic: the samples / lysate / how much protein was loaded
      detail: 'BCA sheet (20th): the lysates read 0.12 µg/µL and 10 µL was loaded per lane, i.e. about 1.2 µg per lane; the
        lab''s standard load written on the sheet header is 20–30 µg.'
    C6:
      topic: detection / ECL substrate / imaging or exposure settings
      detail: 'Imager history: all three blots were captured at a fixed 2 s exposure with high-sensitivity chemi mode off
        (previous FLAG blots here used 60–120 s); ECL substrate lot E-88 in use expired ten months ago, a new kit is in the
        cold room.'
    C7:
      topic: shared buffers / whether anyone else in the lab has had blank blots or reported problems
      detail: 'Lab chat: carboy TB-3 was made up without methanol by mistake on the 18th (a post-it was only added on the
        24th); two other people had blank or faint blots from it, and fresh carboy TB-4 has been made.'
control:rhe:sum_product:
  prompt: "Python coding task 'sum_product' (type: logic) shown to the participant in an online editor with an AI chat assistant.\
    \ The participant must make the unit tests pass.\nTASK DESCRIPTION:\nFor a given list of integers, return a tuple consisting\
    \ of a sum and a product of all the integers in a list. Empty sum should be equal to 0 and empty product should be equal\
    \ to 1.\n >>> sum_product([])\n (0, 1) \n>>> sum_product([1, 2, 3, 4]) \n(10, 24)\n\nSTARTER CODE IN EDITOR:\ndef sum_product(numbers):"
  targets:
    K1:
      detail: asks for a function returning both sum and product as a tuple, e.g. [1,2,3,4] -> (10, 24)
      topic: return a tuple (sum, product) over a list of ints
    K2:
      detail: 'names that [] must give (0, 1): empty sum 0, empty product 1 (product accumulator starts at 1)'
      topic: empty-list behaviour
    K3:
      detail: asks what happens with a 0 in the list or a one-element list, e.g. [100, 0] -> (100, 0), [10] -> (10, 10)
      topic: 'edge cases: zeros / single element'
control:rhe:even_odd_count:
  prompt: "Python coding task 'even_odd_count' (type: logic) shown to the participant in an online editor with an AI chat\
    \ assistant. The participant must make the unit tests pass.\nTASK DESCRIPTION:\nGiven an integer. return a tuple that\
    \ has the number of even and odd digits respectively. \n even_odd_count(-12) ==> (1, 1) ,\n even_odd_count(123) ==> (1,\
    \ 2)\n\nSTARTER CODE IN EDITOR:\ndef even_odd_count(num):"
  targets:
    K1:
      detail: names the digit-wise count and tuple order (even first), e.g. 123 -> (1, 2)
      topic: count even and odd digits of an integer, return (even, odd)
    K2:
      detail: asks how to ignore the minus sign (abs / skip '-'), e.g. -12 -> (1, 1)
      topic: negative numbers
    K3:
      detail: asks about num = 0 -> (1, 0) (0 counts as an even digit; a while-loop on num>0 misses it)
      topic: zero input
    K4:
      detail: asks concretely how to iterate digits (str(abs(num)) vs % 10 loop) and convert chars to int
      topic: digit iteration method
control:rhe:table_transform_named:
  prompt: "Python coding task 'table_transform_named' (type: data_manip) shown to the participant in an online editor with\
    \ an AI chat assistant. The participant must make the unit tests pass.\nTASK DESCRIPTION:\n+----+-------+---------+---------------------+----------+\n\
    |    |   age | color   | dates               |   height |\n|----+-------+---------+---------------------+----------|\n\
    |  0 |     1 | blue    | 2019-03-06 00:00:00 |  2.72656 |\n|  1 |     4 | blue    | 2019-03-05 00:00:00 |  4.77665 |\n\
    |  2 |     4 | green   | 2019-03-10 00:00:00 |  8.12169 |\n|  3 |    10 | brown   | 2019-03-07 00:00:00 |  4.79977 |\n\
    |  4 |    20 | green   | 2019-03-01 00:00:00 |  3.92785 |\n+----+-------+---------+---------------------+----------+\n\
    \n\nThis is a pandas dataframe provided to you above as input.\n\nYou need to transform it exactly to the following output\
    \ dataframe:\n\n+----+----------+--------+---------+---------+---------+-------+----------+\n|    | age      |   blue\
    \ |   brown |   green |   month |   day |   height |\n|----+----------+--------+---------+---------+---------+-------+----------|\n\
    |  0 | Under 18 |      1 |       0 |       0 |       3 |     6 |        3 |\n|  1 | Under 18 |      1 |       0 |    \
    \   0 |       3 |     5 |        5 |\n|  2 | Under 18 |      0 |       0 |       1 |       3 |    10 |        8 |\n| \
    \ 3 | Under 18 |      0 |       1 |       0 |       3 |     7 |        5 |\n|  4 | 18-25    |      0 |       0 |     \
    \  1 |       3 |     1 |        4 |\n+----+----------+--------+---------+---------+---------+-------+----------+\n\nYour\
    \ code should be placed inside a function called transform_df that takes as input a dataframe and returns the transformed\
    \ dataframe\n\nSTARTER CODE IN EDITOR:\nimport pandas as pd\nfrom io import StringIO\n\n# Original dataset\ndata = '''\n\
    age,color,dates,height\n1,blue,2019-03-06,2.72656\n4,blue,2019-03-05,4.77665\n4,green,2019-03-10,8.12169\n10,brown,2019-03-07,4.79977\n\
    20,green,2019-03-01,3.92785\n'''\n\n# Read the dataset into a DataFrame\ndf = pd.read_csv(StringIO(data))\n\ndef transform_df(df):\n\
    \    # Your code here\n\nprint(transform_df(df))"
  targets:
    K1:
      detail: 'names the bins: age < 18 -> ''Under 18'', otherwise ''18-25'' (pd.cut or apply)'
      topic: age -> category string
    K2:
      detail: asks for blue/brown/green 0/1 integer columns from 'color' (pd.get_dummies, astype int)
      topic: one-hot encode color
    K3:
      detail: asks to parse 'dates' with pd.to_datetime and extract .dt.month and .dt.day columns
      topic: month and day from dates
    K4:
      detail: asks to round height to the nearest integer (2.72 -> 3, 4.78 -> 5) as int
      topic: round height
    K5:
      detail: names the exact output column order age, blue, brown, green, month, day, height and dropping color/dates
      topic: drop and reorder columns
control:rhe:order_by_points:
  prompt: "Python coding task 'order_by_points' (type: logic) shown to the participant in an online editor with an AI chat\
    \ assistant. The participant must make the unit tests pass.\nTASK DESCRIPTION:\nWrite a function which sorts the given\
    \ list of integers in ascending order according to the sum of their digits. Note: if there are several items with similar\
    \ sum of their digits, order them based on their index in original list. \n For example: \n >>> order_by_points([1, 11,\
    \ -1, -11, -12]) == [-1, -11, 1, -12, 11]\n >>> order_by_points([]) == []\n\nSTARTER CODE IN EDITOR:\ndef order_by_points(nums):"
  targets:
    K1:
      detail: asks for sorted(nums, key=digit_sum)
      topic: sort by digit sum ascending
    K2:
      detail: pins down -12 -> -1 + 2 = 1, -11 -> -1 + 1 = 0 (only the leading digit is negative)
      topic: 'negative numbers: first digit carries the sign'
    K3:
      detail: asks for a stable sort so equal digit sums preserve input index (Python sorted is stable; do not add a secondary
        key on value)
      topic: ties keep original order
    K4:
      detail: asks to check [1, 11, -1, -11, -12] -> [-1, -11, 1, -12, 11] and [] -> []
      topic: verify on the given example
control:rhe:retriever:
  prompt: 'Python coding task ''retriever'' (type: lengthy_code) shown to the participant in an online editor with an AI chat
    assistant. The participant must make the unit tests pass.

    TASK DESCRIPTION:

    Your task is to create a class called Retriever. This class will be used to retrieve similar vectors from a collection
    of vectors. You should follow the instructions below to complete this task.



    Create an instance of the Retriever class by providing two arguments:

    vectors: A numpy array of vectors you want to analyze.

    k: An integer indicating the number of top similar vectors you want to retrieve.

    Example:


    from numpy import array

    vectors = array([[1, 2], [3, 4], [5, 6]])

    k = 2

    retriever = Retriever(vectors, k)



    Setting ''k'' Value:


    Use the set_k method to update the value of k (number of top vectors to retrieve).

    This method takes a single integer argument.

    The value of k should be between 1 and the total number of vectors. If not, then the method should do nothing (do not
    raise an error).

    Example:

    retriever.set_k(3)


    Adding New Vectors:


    Add additional vectors to your existing collection using the add_vectors method.

    This method accepts a numpy array of new vectors to be added.

    Example:


    new_vectors = array([[7, 8], [9, 10]])

    retriever.add_vectors(new_vectors)



    Calculating Distances:


    To calculate the distance between a query vector and all stored vectors, use the distance method.

    This method takes a single numpy array representing the query vector.

    It returns a numpy array of distances.

    Example:



    query_vector = array([1, 2])

    distances = retriever.distance(query_vector)



    Retrieving Top ''k'' Similar Vectors:


    Use the get_top_k_similar_vectors method to find the top ''k'' vectors most similar to a given query vector.

    This method takes a single numpy array as the query vector.

    It returns a numpy array of the top ''k'' similar vectors.


    Example:


    top_vectors = retriever.get_top_k_similar_vectors(query_vector)


    Generating a Similarity Matrix:


    To create a similarity matrix between multiple queries and the stored vectors, use the get_similarity_matrix method.

    This method accepts a numpy array of query vectors.

    It returns a 2D numpy array where each row corresponds to the distances between a query vector and all stored vectors.


    Example:


    query_vectors = array([[1, 2], [3, 4]])

    similarity_matrix = retriever.get_similarity_matrix(query_vectors)


    STARTER CODE IN EDITOR:

    class Retriever:'
  targets:
    K1:
      detail: asks for constructor storing numpy array and k
      topic: __init__(vectors, k) stores both
    K2:
      detail: pins down 1 <= k <= len(vectors) else do nothing silently (set_k(0) keeps old k)
      topic: set_k validation
    K3:
      detail: asks for np.concatenate/np.vstack of new vectors onto self.vectors
      topic: add_vectors appends rows
    K4:
      detail: names np.linalg.norm(self.vectors - query, axis=1) returning a 1-D array
      topic: distance = Euclidean (L2) to every stored vector
    K5:
      detail: asks for self.vectors[np.argsort(distances)[:k]] (smallest distance first)
      topic: get_top_k_similar_vectors
    K6:
      detail: asks for a 2-D array with one distance row per query vector, shape (n_queries, n_vectors)
      topic: get_similarity_matrix
