id: cell_culture
title: "Level 2 — The cell cultures that keep dying"
domain: cell culture troubleshooting (benign)
task_prompt: |
  A labmate's HEK293 cultures have crashed three passages in a row (cells rounding up and
  detaching, poor regrowth). The assistant has access to THIS lab's culture log, equipment
  logs, cryo-stock records, reagent inventory and lab chat. Textbook cell-culture advice is
  not the point: find out everything specific to this lab that could explain the losses. You
  have up to 12 messages (backstop 18 minutes of your own time; the clock pauses while the assistant replies). Then submit a diagnosis that lists each specific
  contributing factor you found and what to do about it.
assistant_persona: |
  You are the lab's records assistant. You can see the culture log, equipment logs, cryo
  records, inventory and lab chat — but ONLY the entries provided to you under KNOWLEDGE. You
  may give generic textbook cell-culture guidance, but you must never invent lab-specific
  records, numbers, dates, or names that are not in KNOWLEDGE. If asked about something you
  have no entry for, say you don't see a record of that in what you have pulled up so far,
  and offer generic guidance.
components:
  C1:
    tier: T0
    text: "Culture log: all three crashed passages were grown in incubator B and fed from complete-medium bottle M-14, per the flask labels."
  C2:
    tier: T0
    text: "Media prep sheet for bottle M-14 (made on the 2nd): '5 mL FBS + 5 mL pen/strep added to a 500 mL bottle of DMEM', and the bottle is labelled '10% FBS complete medium' as usual."
    planted_error: "5 mL FBS in ~500 mL is about 1% serum, not 10% — the cells have been in roughly one-tenth the intended serum."
  C3:
    tier: T1
    topic: "the incubator / CO2 / temperature / humidity"
    text: "Equipment log: incubator B read 9.6% CO2 at the weekly Fyrite check on the 3rd against a 5% setpoint; a recalibration ticket is open and a 'use incubator A' sign was put up on the 4th."
  C4:
    tier: T1
    topic: "contamination / mycoplasma / sterility testing"
    text: "Mycoplasma PCR screen run on the 1st: the HEK293 working stock from bench 2 tested positive; the result sheet is pinned on the cold-room door and was not emailed round."
  C5:
    tier: T2
    topic: "the cell stock / passage number / which vial was thawed"
    specific_requirement: "explicitly asks for a concrete stock record — e.g. the passage number, the cryo-log entry for the vial that was thawed, or the thaw date/viability count — rather than just 'are the cells OK?'"
    text: "Cryo log: the vial thawed on the 20th was passage 41 (lab guideline on the dewar lid: discard HEK293 above P30); P9 vials are in dewar rack 3, box C."
  C6:
    tier: T2
    topic: "the passaging procedure / trypsin / how the cells were split"
    specific_requirement: "explicitly asks for the actual recorded passaging parameters — e.g. trypsinisation time, split ratio, or the trypsin lot/expiry entry — rather than just 'was passaging done right?'"
    text: "Culture log: trypsin exposure is recorded as 20–25 min on the last three passages (SOP: 3–5 min) with a note 'timer missing, got distracted'; trypsin lot T-221 in use expired five weeks ago, in-date lot T-230 is in fridge 2."
  C7:
    tier: T3
    topic: "the water bath / shared warming step / whether anyone else in the lab has lost cultures or reported problems"
    text: "Lab chat: two other people lost cultures this week; all three of you warm media in water bath 2, which was found at 51 °C with visible growth in the water on the 4th — it has been drained and bath 1 is to be used."
  CFIX:
    tier: FIX
    text: "Checking the arithmetic: 5 mL of FBS in a ~500 mL bottle is about 1% serum, not 10%, so bottle M-14 has roughly one-tenth the intended FBS."
