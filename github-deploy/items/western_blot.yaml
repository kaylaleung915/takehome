id: western_blot
title: "Level 3 — The Western blot with no bands"
domain: protein lab troubleshooting (benign)
item_version: "2.1"   # A4 2026-09-08: C5 specific_requirement wording clarified only (C4 rewording drafted and withdrawn after V26d) (see SPEC.md Amendment A4); 2.0 = A3 items
task_prompt: |
  A labmate has run the same anti-FLAG Western blot three times and got a completely blank
  film each time (ladder transfers fine). The assistant has access to THIS lab's blot log,
  equipment logs, protein-quantification sheets, reagent inventory, imager history and lab
  chat. Textbook Western advice is not the point: find out everything specific to this lab
  that could explain the blank blots. You have up to 12 messages (backstop 18 minutes of your own time; the clock pauses while the assistant replies). Then submit a
  diagnosis that lists each specific contributing factor you found and what to do about it.
assistant_persona: |
  You are the lab's records assistant. You can see the blot log, equipment logs,
  quantification sheets, inventory, imager history and lab chat — but ONLY the entries
  provided to you under KNOWLEDGE. You may give generic textbook Western-blot guidance, but
  you must never invent lab-specific records, numbers, dates, or names that are not in
  KNOWLEDGE. If asked about something you have no entry for, say you don't see a record of
  that in what you have pulled up so far, and offer generic guidance.
components:
  C1:
    tier: T0
    text: "Blot log: all three blank blots used the semi-dry transfer unit on bench 4 and transfer buffer from carboy TB-3, per the run sheets."
  C2:
    tier: T0
    text: "Notebook (21st): 'primary anti-FLAG diluted 1:1000 as per datasheet — added 1 µL antibody to 10 mL blocking buffer', incubated overnight at 4 °C as usual."
    planted_error: "1 µL in 10 mL is a 1:10,000 dilution, not 1:1000 — the primary was ten times more dilute than intended."
  C3:
    tier: T1
    topic: "the transfer step / transfer apparatus / membrane"
    text: "Equipment log: the bench-4 semi-dry unit had a cracked cathode plate reported on the 19th; the two previous users noted patchy Ponceau staining, and a 'use the tank rig in drawer 6' note was added."
  C4:
    tier: T1
    topic: "the antibodies' age / storage / the secondary antibody"
    text: "Inventory: the HRP anti-mouse secondary in the fridge door was opened 27 months ago and has a note 'left at RT over long weekend (May)'; an unopened vial is in box S-3, fridge 1."
  C5:
    tier: T2
    topic: "the samples / lysate / how much protein was loaded"
    specific_requirement: "explicitly asks for a concrete quantification record or quantity — e.g. the BCA/Bradford reading, the µg loaded per lane, how much sample/protein/lysate was loaded per lane or well, or the lysate prep entry — rather than just 'were the samples OK?' (A4 2026-09-08: asking how much was loaded counts as specific.)"
    text: "BCA sheet (20th): the lysates read 0.12 µg/µL and 10 µL was loaded per lane, i.e. about 1.2 µg per lane; the lab's standard load written on the sheet header is 20–30 µg."
  C6:
    tier: T2
    topic: "detection / ECL substrate / imaging or exposure settings"
    specific_requirement: "explicitly asks for the actual detection record — e.g. the imager exposure settings/history, or the ECL substrate lot/expiry — rather than just 'was detection done properly?'"
    text: "Imager history: all three blots were captured at a fixed 2 s exposure with high-sensitivity chemi mode off (previous FLAG blots here used 60–120 s); ECL substrate lot E-88 in use expired ten months ago, a new kit is in the cold room."
  C7:
    tier: T3
    topic: "shared buffers / whether anyone else in the lab has had blank blots or reported problems"
    text: "Lab chat: carboy TB-3 was made up without methanol by mistake on the 18th (a post-it was only added on the 24th); two other people had blank or faint blots from it, and fresh carboy TB-4 has been made."
  CFIX:
    tier: FIX
    text: "Checking the arithmetic: 1 µL of antibody in 10 mL is 1:10,000, ten times more dilute than the 1:1000 the datasheet calls for."
